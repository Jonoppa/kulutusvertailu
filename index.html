<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Autokulut – vertaile autojen energiakustannuksia.">
<title>Autokulut – latautuu</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#071d1b;color:#eafff8;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(620px,100%);padding:32px;border:1px solid #24564d;border-radius:24px;background:linear-gradient(145deg,#10332d,#0b2422);box-shadow:0 24px 90px #0006}h1{margin:0 0 8px;font-size:clamp(28px,6vw,42px);letter-spacing:-.04em}.mark{color:#72f1b9}p{color:#c3dcd4}progress{width:100%;height:8px;accent-color:#72f1b9}small{color:#8eada4}#error{color:#ffb4a9;white-space:pre-wrap}
</style>
</head>
<body>
<main class="card">
<h1><span class="mark">⚡</span> Autokulut</h1>
<p id="status">Ladataan vertailusivua…</p>
<progress id="progress" max="11" value="0"></progress>
<p><small>Julkaisuversio latautuu. Ensimmäinen avaaminen voi kestää hetken.</small></p>
<p id="error"></p>
</main>
<script>
(async()=>{
 const total=11;
 try{
  const parts=[];
  for(let n=1;n<=total;n++){
   const file='site-data-'+String(n).padStart(2,'0')+'.txt';
   const response=await fetch(new URL(file,document.baseURI),{cache:'no-store'});
   if(!response.ok)throw new Error('Lataus epäonnistui tiedostolle '+file+' (HTTP '+response.status+').');
   parts.push((await response.text()).trim());
   document.getElementById('progress').value=n;
   document.getElementById('status').textContent='Ladataan sivustoa… '+n+'/'+total;
  }
  const binary=atob(parts.join(''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('Selain ei tue sivuston purkamista. Kokeile uutta Chrome- tai Edge-versiota.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  html=html.replace(/\s*<div class="live-pill" id="catalog-count"[^>]*>[\s\S]*?<\/div>/, '');
  html=html.replace(/        <div class="field">\s*<label for="gasoline-price">[\s\S]*?(?=        <div class="field">\s*<label for="annual-km">)/, [
'        <div class="field">',
'          <label for="gasoline-price">Bensiini 95E10</label>',
'          <div class="input-unit"><input id="gasoline-price" type="number" min="0" max="10" step="0.001" value="2.149"><span class="unit">€/l</span></div>',
'          <div class="field-note">Oletus: Tankille.fi:n Suomen halvin ilmoitettu hinta viimeisen 24 tunnin listalla. Bensiinimallien laskennassa käytetään oletuksena 95E10:tä.</div>',
'        </div>',
'        <div class="field">',
'          <label for="gasoline98-price">Bensiini 98E5</label>',
'          <div class="input-unit"><input id="gasoline98-price" type="number" min="0" max="10" step="0.001" value="2.259"><span class="unit">€/l</span></div>',
'          <div class="field-note">Oletus: Tankille.fi:n Suomen halvin ilmoitettu hinta viimeisen 24 tunnin listalla. Voit valita tämän käsin lisätyn auton polttoaineeksi.</div>',
'        </div>',
'        <div class="field">',
'          <label for="diesel-price">Diesel</label>',
'          <div class="input-unit"><input id="diesel-price" type="number" min="0" max="10" step="0.001" value="2.353"><span class="unit">€/l</span></div>',
'          <div class="field-note">Oletus: Tankille.fi:n Suomen halvin ilmoitettu hinta viimeisen 24 tunnin listalla.</div>',
'        </div>',
'        <div class="field">',
'          <label for="home-price">Sähkö · kotilataus</label>',
'          <div class="input-unit"><input id="home-price" type="number" min="0" max="5" step="0.01" value="0.15"><span class="unit">€/kWh</span></div>',
'          <div class="field-note">Laskennallinen kokonaishinta: sähköenergia ja myyjän marginaali + yleissiirron suuntaa-antava maksu + sähkövero, kaikki verollisena. Oman verkkoyhtiön ja sopimuksen hinta voi poiketa.</div>',
'        </div>',
'        <div class="field">',
'          <label for="public-price">Sähkö · julkinen lataus</label>',
'          <div class="input-unit"><input id="public-price" type="number" min="0" max="5" step="0.01" value="0.30"><span class="unit">€/kWh</span></div>',
'          <div class="field-note">Yleinen vertailuoletus julkiselle lataukselle: tavallinen lataus on tyypillisesti noin 0,27 €/kWh ja pikalataus noin 0,38 €/kWh. Asemakohtaiset hinnat vaihtelevat.</div>',
'        </div>'
  ].join('\n') + '\n');
  html=html.replace("      const fuelName = isEV ? 'Sähkö' : first.fuelName;", "      const fuelName = isEV ? 'Sähkö' : first.fuelName === 'Bensiini' ? '95E10' : first.fuelName;");
  html=html.replace("      gasoline: document.getElementById('gasoline-price'), diesel: document.getElementById('diesel-price'), e85: document.getElementById('e85-price'), gas: document.getElementById('gas-price'), home: document.getElementById('home-price'),\n      public: document.getElementById('public-price'), annual: document.getElementById('annual-km'),", "      gasoline: document.getElementById('gasoline-price'), gasoline98: document.getElementById('gasoline98-price'), diesel: document.getElementById('diesel-price'), home: document.getElementById('home-price'),\n      public: document.getElementById('public-price'), annual: document.getElementById('annual-km'),");
  html=html.replace("    const fuelUnitPrice = car => car.fuelName === 'Diesel' ? numeric(els.diesel) : car.fuelName === 'Kaasu' ? numeric(els.gas) : car.fuelName === 'E85' ? numeric(els.e85) : numeric(els.gasoline);", "    const fuelUnitPrice = car => car.fuelName === 'Diesel' ? numeric(els.diesel) : car.fuelName === '98E5' ? numeric(els.gasoline98) : car.fuelName === 'Kaasu' ? 2.20 : car.fuelName === 'E85' ? 1.25 : numeric(els.gasoline);");
  html=html.replace("    const manualFuelOptions = [\n      { value: 'petrol', label: 'Bensiini' },\n      { value: 'diesel', label: 'Diesel' },", "    const manualFuelOptions = [\n      { value: 'petrol-95', label: 'Bensiini 95E10' },\n      { value: 'petrol-98', label: 'Bensiini 98E5' },\n      { value: 'diesel', label: 'Diesel' },");
  html=html.replace("      car.fuelName = kind === 'diesel' || kind === 'diesel-hybrid' || kind === 'phev-diesel' ? 'Diesel' : kind === 'electric' ? 'Sähkö' : kind === 'gas' ? 'Kaasu' : kind === 'e85' ? 'E85' : 'Bensiini';", "      car.fuelName = kind === 'diesel' || kind === 'diesel-hybrid' || kind === 'phev-diesel' ? 'Diesel' : kind === 'electric' ? 'Sähkö' : kind === 'gas' ? 'Kaasu' : kind === 'e85' ? 'E85' : kind === 'petrol-98' ? '98E5' : '95E10';");
  html=html.replace("      return setManualKind(car, 'petrol');", "      return setManualKind(car, 'petrol-95');");
  html=html.replace("    [els.gasoline, els.diesel, els.e85, els.gas, els.home, els.public, els.annual].forEach(el => el.addEventListener('input', render));", "    [els.gasoline, els.gasoline98, els.diesel, els.home, els.public, els.annual].forEach(el => el.addEventListener('input', render));");

  html=html.replace('<h1>Paljonko autosi oikeasti maksaa ajaa?</h1>', '<h1>Vertaa autojen ajokustannuksia</h1>');
  html=html.replace('<title>Autokulut – automerkkien vertailu</title>', '<title>Autokulut – autojen ajokustannusvertailu</title>');
  html=html.replace('<meta name="description" content="Vertaa eri automerkkien energiakustannuksia vuodesta 1990 eteenpäin ja syötä kulutustiedot myös itse.">', '<meta name="description" content="Vertaa autojen polttoaine- ja latauskustannuksia valitun kulutusprofiilin ja vuotuisen ajomäärän perusteella.">');
  html=html.replace('</style>', "\n    #left-source a, #right-source a { display: none !important; }\n    .annual-comparison { margin-top: 22px; padding: 22px; }\n    .annual-intro { margin: 7px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }\n    .annual-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }\n    .annual-card { min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: #fbfdfd; }\n    .annual-tag { margin-bottom: 8px; color: var(--teal-dark); font-size: 10px; font-weight: 850; letter-spacing: .08em; }\n    .annual-card h3 { margin: 0 0 14px; font-size: 17px; overflow-wrap: anywhere; }\n    .annual-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid #e4eded; font-size: 13px; }\n    .annual-row:last-child { border-bottom: 0; }\n    .annual-row span { color: var(--muted); }\n    .annual-row strong { text-align: right; color: var(--ink); white-space: nowrap; }\n    .annual-row.total strong { color: var(--teal-dark); font-size: 18px; }\n    .annual-summary { margin-top: 16px; padding: 16px; border-radius: 13px; background: var(--teal-soft); color: var(--teal-dark); font-size: 14px; line-height: 1.55; }\n    .annual-note { margin-top: 11px; color: var(--muted); font-size: 11px; line-height: 1.5; }\n    @media (max-width: 650px) { .annual-comparison { padding: 17px; } .annual-grid { grid-template-columns: 1fr; } }\n\n" + '</style>');
  html=html.replace('<p class="footnote">', "<section class=\"panel annual-comparison\" id=\"annual-comparison\" aria-labelledby=\"annual-title\">\n  <h2 id=\"annual-title\">Vuositason polttoaine- ja energiakustannukset</h2>\n  <p class=\"annual-intro\">Arvio perustuu yllä ilmoitettuun ajomäärään, valittuun kulutusprofiiliin ja hintoihin. Sähköautoille näytetään sekä koti- että julkisen latauksen vuosikustannus.</p>\n  <div class=\"annual-grid\">\n    <div class=\"annual-card\" id=\"left-annual\"><div class=\"hint\">Valitse nykyinen auto nähdäksesi vuosikustannuksen.</div></div>\n    <div class=\"annual-card\" id=\"right-annual\"><div class=\"hint\">Valitse vertailtava auto nähdäksesi vuosikustannuksen.</div></div>\n  </div>\n  <div class=\"annual-summary\" id=\"annual-summary\">Valitse molemmat autot, niin näet vuosikustannusten eron.</div>\n  <p class=\"annual-note\">Laskelma kuvaa energia- tai polttoainekuluja, ei auton arvonalenemaa, vakuutuksia, huoltoja tai veroja. Sähköauton vuosittainen vertailusäästö käyttää kotilatausta.</p>\n</section>\n  <p class=\"footnote\">");
  html=html.replace('    function profileLabel() {', "    function renderAnnualComparison(left, right) {\n      const km = numeric(els.annual);\n      const summary = document.getElementById('annual-summary');\n      function renderSide(car, side) {\n        const target = document.getElementById(side + '-annual');\n        const tag = side === 'left' ? 'NYKYINEN AUTO' : 'VERTAILTAVA AUTO';\n        if (!car) { target.innerHTML = '<div class=\"annual-tag\">' + tag + '</div><div class=\"hint\">Valitse auto nähdäksesi vuositason arvion.</div>'; return null; }\n        const used = consumption(car);\n        if (used === null) { target.innerHTML = '<div class=\"annual-tag\">' + tag + '</div><h3>' + escapeHtml(displayCarName(car)) + '</h3><div class=\"hint\">Täytä kulutustiedot valitulle ajoprofiilille, niin vuosikustannus lasketaan.</div>'; return null; }\n        const yearlyAmount = used * km / 100;\n        const yearlyUnit = car.type === 'ev' ? 'kWh/v' : car.fuelName === 'Kaasu' ? 'kg/v' : 'l/v';\n        const yearlyBaseCost = cost(car, 'home') * km / 100;\n        let html = '<div class=\"annual-tag\">' + tag + '</div>' + '<h3>' + escapeHtml(displayCarName(car)) + '</h3>' + '<div class=\"annual-row\"><span>Vuotuinen ajomäärä</span><strong>' + fmt(km, 0) + ' km</strong></div>' + '<div class=\"annual-row\"><span>Energiankulutus vuodessa</span><strong>' + fmt(yearlyAmount, 0) + ' ' + yearlyUnit + '</strong></div>';\n        if (car.type === 'ev') { html += '<div class=\"annual-row total\"><span>Kotilataus vuodessa</span><strong>' + money(yearlyBaseCost) + '</strong></div>' + '<div class=\"annual-row\"><span>Julkinen lataus vuodessa</span><strong>' + money(cost(car, 'public') * km / 100) + '</strong></div>'; }\n        else { html += '<div class=\"annual-row total\"><span>Polttoainekustannus vuodessa</span><strong>' + money(yearlyBaseCost) + '</strong></div>' + '<div class=\"annual-note\">Laskennan polttoainehinta: ' + fmt(fuelUnitPrice(car), 3) + ' ' + fuelPriceUnit(car) + '.</div>'; }\n        target.innerHTML = html; return yearlyBaseCost;\n      }\n      const leftCost = renderSide(left, 'left'); const rightCost = renderSide(right, 'right');\n      if (leftCost === null || rightCost === null) { summary.innerHTML = 'Valitse molemmat autot ja varmista, että kulutustiedot ovat saatavilla, niin näet vuosikustannusten eron.'; return; }\n      const difference = Math.abs(leftCost - rightCost);\n      if (difference < 1) { summary.innerHTML = '<strong>Vuositason vertailu:</strong> autojen arvioidut energia- tai polttoainekustannukset ovat lähes samat.'; return; }\n      const cheaper = leftCost > rightCost ? right : left;\n      summary.innerHTML = '<strong>Vuositason vertailu:</strong> ' + escapeHtml(displayCarName(cheaper)) + ' on näillä oletuksilla noin <strong>' + money(difference) + '</strong> vuodessa edullisempi kotilataushinnan tai polttoainehinnan mukaan. Julkisen latauksen vaihtoehto näkyy erikseen.';\n    }\n    function profileLabel() {");
  html=html.replace("      renderCar(right, 'right');", "      renderCar(right, 'right');\n      renderAnnualComparison(left, right);");

  html=html.replace("    function getProductionYears(rows, first) {", "    [\n      [\"Honda|CR-Z|ZF1\",\"2011–2016\"]\n      [\"Honda|FR-V|BE1/BE3\",\"2005–2009\"]\n      [\"Honda|HR-V|RU\",\"2015–2020\"]\n      [\"Honda|HR-V|RV\",\"2021–\"]\n      [\"Honda|Insight|ZE2\",\"2010–2014\"]\n      [\"Honda|e:Ny1|RZ6\",\"2023–\"]\n      [\"Hyundai|Accent|LC\",\"1999–2005\"]\n      [\"Hyundai|Accent|MC\",\"2005–2010\"]\n      [\"Hyundai|Accent|RB\",\"2011–2019\"]\n      [\"Hyundai|Accent|HC\",\"2017–\"]\n      [\"Hyundai|Elantra|J2\",\"1995–2000\"]\n      [\"Hyundai|Elantra|XD\",\"2000–2006\"]\n      [\"Hyundai|Elantra|HD\",\"2006–2009\"]\n      [\"Hyundai|Elantra|MD\",\"2010–2015\"]\n      [\"Hyundai|Elantra|AD\",\"2015–2020\"]\n      [\"Hyundai|Elantra|CN7\",\"2020–\"]\n      [\"Kia|Rio|DC\",\"2000–2005\"]\n      [\"Kia|Rio|JB\",\"2005–2011\"]\n      [\"Kia|Rio|UB\",\"2011–2017\"]\n      [\"Kia|Rio|YB\",\"2016–2023\"]\n      [\"Kia|Soul|AM\",\"2009–2014\"]\n      [\"Kia|Soul|PS\",\"2014–2019\"]\n      [\"Kia|Soul|SK3\",\"2019–2024\"]\n      [\"Kia|Soul EV|PS EV\",\"2014–2019\"]\n      [\"Kia|Soul EV|SK3 EV\",\"2019–2023\"]\n      [\"Kia|Niro EV|DE EV\",\"2018–2022\"]\n      [\"Kia|Niro EV|SG2 EV\",\"2022–\"]\n      [\"Lexus|GS|S140\",\"1991–1997\"]\n      [\"Lexus|GS|S160\",\"1997–2005\"]\n      [\"Lexus|GS|S190\",\"2005–2011\"]\n      [\"Lexus|GS|L10\",\"2012–2020\"]\n      [\"Mazda|121|DB\",\"1991–1995\"]\n      [\"Mazda|121|DW\",\"1996–2002\"]\n      [\"Mazda|323|BG\",\"1989–1994\"]\n      [\"Mazda|323|BA\",\"1994–2000\"]\n      [\"Mazda|323|BJ\",\"1998–2003\"]\n      [\"Mazda|5|CR\",\"2005–2010\"]\n      [\"Mazda|5|CW\",\"2010–2018\"]\n      [\"Mazda|CX-5|KE\",\"2012–2017\"]\n      [\"Mazda|CX-5|KF\",\"2016–2025\"]\n      [\"Mazda|Demio|DW\",\"1996–2002\"]\n      [\"Mazda|Demio|DY\",\"2002–2007\"]\n      [\"Mazda|Demio|DE\",\"2007–2014\"]\n    ].forEach(([key, years]) => { if (!generationYearCatalog.has(key)) generationYearCatalog.set(key, years); });\n\n    function getProductionYears(rows, first) {");
  html=html.replace("const generationDisplay = generationLabel\n        ? (generationAlreadyHasYears ? generationLabel : `${generationLabel}${productionYears ? ` (${productionYears})` : ' (valmistusvuodet tarkistettava)'}`)\n        : (productionYears || 'valmistusvuodet tarkistettava');\n      const generationInName = generationLabel ? ` · ${generationDisplay}` : ` · ${generationDisplay}`;", "const generationDisplay = generationLabel && generationLabel !== 'Sukupolvi tarkistettava'\n        ? (generationAlreadyHasYears ? generationLabel : `${generationLabel}${productionYears ? ` (${productionYears})` : ''}`)\n        : (productionYears || '');\n      const generationInName = generationDisplay ? ` · ${generationDisplay}` : '';");

  html=html.replace("      input.addEventListener('blur', () => {\n        window.setTimeout(() => {\n          if (!list.contains(document.activeElement)) closeDropdown(side, true);\n        }, 0);\n      });", "      input.addEventListener('blur', () => {\n        // Touch-selaimissa blur voi tapahtua ennen kuin listan napin click ehtii käynnistyä.\n        // Pieni viive antaa mobiilin kosketusvalinnalle aikaa käsitellä valinta.\n        window.setTimeout(() => {\n          if (!list.contains(document.activeElement)) closeDropdown(side, true);\n        }, 350);\n      });");

  document.open();document.write(html);document.close();
 }catch(error){
  document.getElementById('status').textContent='Sivuston lataus ei onnistunut.';
  document.getElementById('error').textContent=error.message+' Tarkista, että kaikki site-data-01.txt–site-data-11.txt-tiedostot ovat samassa GitHub Pages -hakemistossa.';
 }
})();
</script>
</body>
</html>
